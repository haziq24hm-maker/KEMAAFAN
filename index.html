<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Memohon Kemaafan, SAYANG!</title>
  <meta name="description" content="Kad ucapan untuk SAYANG - TERIMALAH KEMAAFAN DARI ABANG" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Tambahan CSS terus dalam index untuk emoji sedih */
    .emoji-bg {
      position: fixed;
      top: -50px;
      user-select: none;
      pointer-events: none;
      z-index: -1;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="page" role="main">
    <div class="card" role="article" aria-labelledby="name">
      <h1 id="name" class="name">SAYANG</h1>
      <p class="message">TERIMALAH KEMAAFAN DARI ABANG</p>

      <div class="controls" aria-hidden="false">
        <button id="confettiBtn" class="btn primary">Raikan!</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
